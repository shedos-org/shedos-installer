# ShedOS Calamares Installer Configuration
# https://github.com/calamares/calamares/wiki/Deploy-Configuration

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  # User-facing screens
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  # Installation execution
  - exec:
      - partition                              # Creates and formats partitions
      - mount                                  # Mount filesystems + create BTRFS subvolumes
      - unpackfs                               # Copy system files from squashfs
      - copykernel                             # Copy kernel from ISO (not in squashfs)
      - fstab                                  # Generate /etc/fstab
      - locale                                 # Set locale
      - keyboard                               # Set keyboard layout
      - localecfg                              # Write /etc/locale.conf
      - users                                  # Create user account
      - networkcfg                             # Configure NetworkManager
      - hwclock                                # Set hardware clock
      - initcpiocfg                            # Configure mkinitcpio
      - initcpio                               # Generate initramfs
      - shedos_limine                          # Install Limine bootloader (Python module)
      - shedos_configs                         # Deploy Hyprland/Waybar/Neovim configs
      - shedos_gitconfig                       # Configure git with user data
      - shedos_plymouth                        # Configure Plymouth boot splash
      - shedos_finalize                        # Enable services, final setup
      - umount                                 # Unmount filesystems

  # Completion screen
  - show:
      - finished

# ShedOS branding
branding: shedos

# Installation settings
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
