# ShedOS Calamares Installer Configuration
# https://github.com/calamares/calamares/wiki/Deploy-Configuration

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  # User-facing screens
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
      - recoverykeyq                            # Show + gate the LUKS recovery key (encrypted installs)

  # Installation execution
  - exec:
      - partition
      - mount
      - shedos_luks_escrow                      # Enroll the recovery key as a second LUKS keyslot
      - shedos_sourcemedia                      # Resolve airootfs.sfs (bootmnt vs copytoram)
      - unpackfs
      - copykernel
      - fstab
      - locale                                  # Set locale
      - keyboard                                # Set keyboard layout
      - localecfg                               # Write /etc/locale.conf
      - users                                   # Create user account
      - networkcfg                              # Configure NetworkManager
      - hwclock                                 # Set hardware clock
      - initcpiocfg                             # Configure mkinitcpio
      - shedos_nvidia                           # Detect and install NVIDIA drivers
      # No standalone `initcpio` step: shedos_limine rewrites HOOKS and
      # runs mkinitcpio -P itself, so the earlier run only built images
      # that were immediately rebuilt — minutes of wasted install time.
      - shedos_limine                           # Install Limine bootloader (copies initramfs to ESP)
      - shedos_configs                          # Deploy user configs
      - shedos_gitconfig                        # Configure git with user data
      - shedos_finalize                         # Enable services, final setup (Keyring, Shell, etc.)

      - umount                                  # Unmount filesystems

  # Completion screen
  - show:
      - finished

# ShedOS branding
branding: shedos

# Installation settings
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
