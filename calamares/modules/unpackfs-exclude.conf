# Files to exclude when copying live system to installed system

# Live environment specific
/etc/calamares/
/home/shedos/
/root/.automated_script.sh
/root/.zlogin
/etc/systemd/system/getty@tty1.service.d/
/etc/mkinitcpio.d/linux.preset.pacsave
/etc/mkinitcpio.conf.d/archiso.conf

# Machine-specific
/etc/machine-id
/var/lib/dbus/machine-id
/etc/hostname
/etc/hosts
/etc/localtime
/etc/locale.conf
/etc/vconsole.conf

# Runtime and temp files
/run/*
/tmp/*
/var/tmp/*
/var/cache/pacman/pkg/*
/var/log/*
/lost+found

# Other live-specific
/etc/sudoers.d/g_wheel
/etc/polkit-1/rules.d/49-nopasswd_global.rules
/etc/systemd/system/multi-user.target.wants/pacman-init.service
/etc/systemd/system/etc-pacman.d-gnupg.mount
