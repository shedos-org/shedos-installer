# Files excluded when copying live ISO airootfs onto /target.
# airootfs IS the developer install — these are the live-only artifacts
# that must not persist on the installed system.

# Live-only: Calamares installer + autologin + live user
/etc/calamares/
/usr/lib/calamares/
/usr/bin/calamares
/etc/sudoers.d/calamares-live
/etc/systemd/system/getty@tty1.service.d/
/home/shedos/
/root/.automated_script.sh
/root/.zlogin
/etc/mkinitcpio.d/linux.preset.pacsave
/etc/mkinitcpio.conf.d/archiso.conf

# Machine-specific (regenerated on first boot of the installed system)
/etc/machine-id
/var/lib/dbus/machine-id
/etc/hostname
/etc/hosts
/etc/localtime
/etc/locale.conf
/etc/vconsole.conf

# Runtime and temp files
/run/*
/tmp/*
/var/tmp/*
/var/cache/pacman/pkg/*
/var/log/*
/lost+found
