# Files excluded when copying live ISO airootfs onto /target.
# airootfs IS the developer install — these are the live-only artifacts
# that must not persist on the installed system.

# Live-only: Calamares installer + autologin + live user
/etc/calamares/
/usr/lib/calamares/
/usr/bin/calamares
/usr/share/applications/shedos-install.desktop
/etc/sudoers.d/calamares-live
/etc/systemd/system/getty@tty1.service.d/
/home/shedos/
/root/.automated_script.sh
/root/.zlogin
/etc/mkinitcpio.d/linux.preset.pacsave
/etc/mkinitcpio.conf.d/archiso.conf
# Live-ISO welcome banner — printed to whichever tty greetd's session
# worker spawns on, leaves the banner text in that VT's vcs buffer,
# fbcon paints it during DRM-master gaps (boot→greeter, greeter→
# Hyprland, Hyprland→shutdown). Bug-class is "stale live-ISO artifacts
# painted during compositor handoffs"; the paired self-heal for
# already-installed systems lives in shedos-hyprland.install.
/etc/profile.d/shedos-live.sh

# Machine-specific (regenerated on first boot of the installed system)
/etc/machine-id
/var/lib/dbus/machine-id
/etc/hostname
/etc/hosts
/etc/localtime
/etc/locale.conf
/etc/vconsole.conf

# Runtime and temp files
/run/*
/tmp/*
/var/tmp/*
/var/cache/pacman/pkg/*
/var/log/*
/lost+found
