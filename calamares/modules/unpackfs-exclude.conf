# Files to exclude when copying live ISO contents to the installed system.
# install.sfs is built fresh by scripts/build-install-rootfs.sh — it does
# NOT contain live-only artifacts. These exclusions are belt-and-braces
# for paths that must always be regenerated by the installed system or
# Calamares itself.

# Machine-specific
/etc/machine-id
/var/lib/dbus/machine-id
/etc/hostname
/etc/hosts
/etc/localtime
/etc/locale.conf
/etc/vconsole.conf

# Runtime and temp files
/run/*
/tmp/*
/var/tmp/*
/var/cache/pacman/pkg/*
/var/log/*
/lost+found
