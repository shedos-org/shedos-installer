# ShedOS Finished Module Configuration

# Behavior when installation completes. user-unchecked: show the "Restart now"
# button, default it unchecked, and restart only when the user checks it — the
# installer always waits on the finished screen and never restarts on its own.
# This is the modern, well-defined key; it replaces the deprecated
# restartNowEnabled/restartNowChecked pair.
restartNowMode: user-unchecked

# Command to restart (default uses systemctl)
restartNowCommand: "systemctl reboot"

# Message customization is done in branding
notifyOnFinished: true
