# Run from live environment (dontChroot: true) because the script
# is in the live system, not the installed system
dontChroot: true
timeout: 300

# Install Limine bootloader using the script from live environment
# Pass @@ROOT@@ as argument so the script knows where the target is
script:
    - "/usr/local/bin/shedos-install-limine @@ROOT@@"
