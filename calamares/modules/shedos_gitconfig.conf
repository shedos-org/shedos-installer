# ShedOS Git Configuration Module
# Job module: writes ~/.gitconfig for the new user and (optionally)
# generates an ed25519 SSH key for them.
#
# Values are read from global storage:
# - username       (set by the users module)
# - fullName       (set by the users module)
# - devinfoEmail   (set by the users module — ShedOS patch)
# - devinfoSsh     (set by the users module — ShedOS patch; bool)
