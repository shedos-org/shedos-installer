# ShedOS Locale Module Configuration

# Region and zone for timezone
region: "America"
zone: "New_York"

# Locale generation settings
localeGenPath: /etc/locale.gen

# No geoip block on purpose: the install is fully offline, and a
# third-party probe would either fail (no network) or leak the user's
# IP for no benefit (see welcome.conf). Users pick their timezone on
# the map.
