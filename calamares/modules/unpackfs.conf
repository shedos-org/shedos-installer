# The symlink is maintained by shedos_sourcemedia: it points at the
# squashfs on the boot medium, or at the copytoram copy when
# copytoram=y moved the image to RAM (where the hardcoded bootmnt
# path used to break the install).
unpack:
    - source: "/run/shedos/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
      excludeFile: "/etc/calamares/modules/unpackfs-exclude.conf"
