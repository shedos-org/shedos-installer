# ShedOS Mount Module Configuration
# Defines the 13 BTRFS subvolumes with optimized mount options

# Extra mounts for chroot environment
# These are essential for shellprocess scripts to work correctly
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# Mount options for different filesystem types
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1, ssd, discard=async ]
    - filesystem: ext4
      options: [ defaults, noatime ]
    - filesystem: xfs
      options: [ defaults, noatime ]

# ShedOS BTRFS Subvolume Layout (13 subvolumes)
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var
      subvolume: /@var
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /tmp
      subvolume: /@tmp
    - mountPoint: /var/cache/pacman/pkg
      subvolume: /@pkg
    - mountPoint: /srv
      subvolume: /@srv
    - mountPoint: /opt
      subvolume: /@opt
    - mountPoint: /var/lib/docker
      subvolume: /@docker
    - mountPoint: /var/lib/machines
      subvolume: /@machines
