# ShedOS fstab Module Configuration

# Mount options for fstab generation
mountOptions:
    default: "defaults"
    btrfs: "subvol=${subvol},compress=zstd:1,noatime,ssd,discard=async"
    vfat: "umask=0077"
    ext4: "defaults,noatime"
    xfs: "defaults,noatime"

# SSD-specific extra mount options
ssdExtraMountOptions:
    btrfs: "ssd,discard=async"
    ext4: "discard"

# crypttab options for LUKS
crypttabOptions: luks

# Use UUID for device identification (most reliable)
# Options: uuid, label, partuuid, partlabel, device
mountPointOptions:
    /: uuid
    /home: uuid
    /boot/efi: uuid
