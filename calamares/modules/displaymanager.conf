# DisplayManagers module
# Handles checking for display managers and setting up autologin.

displaymanagers:
  - sddm

# Enable basic setup (installing/enabling service)?
# We handle this manually in customize_airootfs.sh and systemd units, 
# but setting true ensures Calamares writes the correct config paths.
basicSetup: false

# Setup autologin?
# This reads the 'doAutologin' flag from global storage (set by users module)
sysconfigSetup: true
