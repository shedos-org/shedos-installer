# ShedOS Partition Module Configuration
# Full flexibility mode - users can customize partitions

# EFI System Partition settings
efiSystemPartition: "/boot/efi"
# Limine reads only FAT, so the kernels+initramfs live on the ESP, not on
# btrfs /boot. During the shedos-kernel→linux-zen migration two kernels x
# (default+fallback) coexist here; even slimmed (firmware stripped from
# the initramfs) that is ~250 MiB, and 512M left no room for microcode, a
# third kernel, or a firmware-heavy NVIDIA initramfs. 1G is cheap on a
# developer-class disk and removes the cliff for good. Undersizing is
# unrecoverable without repartitioning; oversizing costs ~0.5 GiB.
efiSystemPartitionSize: 1G
efiSystemPartitionName: "EFI"

# btrfs only: the @ subvolume layout, snapper snapshots and
# `shedman rollback` all depend on it, and the rendered kernel
# cmdline hardcodes the btrfs rootflags. Offering ext4/xfs produced
# installs that panicked on first boot. Manual partitioning can still
# craft a non-btrfs root; shedos_limine refuses it with a clear
# message instead of writing an unbootable config.
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
    - btrfs

# Partition table
defaultPartitionTableType: gpt
availablePartitionTableTypes:
    - gpt
    - msdos

# Prepend an 8 MiB bios-boot (EF02) partition AND the ESP on every
# erase-disk install, regardless of firmware. Limine reads only
# FAT/ISO9660, so BIOS installs boot from the same FAT partition the
# ESP provides, and `limine bios-install` on GPT requires an EF02
# partition to embed its stage2 (the pre-partition gap is never used
# on GPT). One layout, bootable under both firmwares.
createHybridBootloaderLayout: true

# LUKS2 encryption support
luksGeneration: luks2

# Swap options
userSwapChoices:
    - none
    - small     # 2GB
    - suspend   # Equal to RAM
    - file

# Partition options
drawNestedPartitions: true
alwaysShowPartitionLabels: true

# Installation methods available to user
initialPartitioningChoice: erase
allowManualPartitioning: true

# Default partition layout when "Erase disk" is selected
initialSwapChoice: none
