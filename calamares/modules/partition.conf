# ShedOS Partition Module Configuration
# Full flexibility mode - users can customize partitions

# EFI System Partition settings
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"

# Filesystem defaults - BTRFS for ShedOS
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs

# Partition table
defaultPartitionTableType: gpt
availablePartitionTableTypes:
    - gpt
    - msdos

# LUKS2 encryption support
luksGeneration: luks2

# Swap options
userSwapChoices:
    - none
    - small     # 2GB
    - suspend   # Equal to RAM
    - file

# Partition options
drawNestedPartitions: true
alwaysShowPartitionLabels: true

# Installation methods available to user
initialPartitioningChoice: erase
allowManualPartitioning: true

# Default partition layout when "Erase disk" is selected
initialSwapChoice: none
