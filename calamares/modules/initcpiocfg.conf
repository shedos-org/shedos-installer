# ShedOS initcpiocfg configuration
# Configures mkinitcpio.conf for the installed system

# Kernel to configure. shedos-kernel is the only kernel ShedOS ships;
# vanilla `linux` was dropped from packages/official/base.txt to keep
# the ISO under 3.5 GB. Pointing this at `linux` would make Calamares
# try to regen initramfs for a kernel that isn't installed on the
# target.
kernel: shedos-kernel
