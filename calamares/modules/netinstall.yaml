# Optional-apps picker for the Calamares show: sequence. User checks
# any subset (default: all four). Each leaf is a single proprietary
# AUR app the user can opt out of without affecting the base install.
---
- name: "Optional Development Tools"
  description: "Pick the apps you'd like installed. You can change selection later with shedman install."
  hidden: false
  selected: true
  critical: false
  packages:
    - name: "Google Chrome"
      description: "Web browser with Widevine streaming support."
      packages:
        - google-chrome
      selected: true
    - name: "Postman"
      description: "API client for HTTP/REST development."
      packages:
        - postman-bin
      selected: true
    - name: "Claude Code"
      description: "Anthropic's agentic coding tool for the terminal."
      packages:
        - claude-code-bin
      selected: true
    - name: "JetBrains Toolbox"
      description: "Manages PyCharm, IntelliJ, WebStorm, and other JetBrains IDEs."
      packages:
        - jetbrains-toolbox
      selected: true
