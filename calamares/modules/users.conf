# ShedOS Users Module Configuration

# Default groups for new user
# ShedOS includes all necessary groups for desktop usage
defaultGroups:
    - wheel      # Sudo access
    - video      # GPU access
    - audio      # Audio devices
    - input      # Input devices
    - seat       # libseat / Hyprland seat0 acquisition
    - storage    # Removable storage
    - lp         # Printing
    - network    # Network management
    - power      # Power management

# Sudo configuration
sudoersGroup: wheel
sudoersConfigureWithGroup: true

# Root account: no separately-set password. ShedOS grants admin
# access through `sudo` (wheel group); root login stays locked.
# This also hides Calamares' root-password UI on the users page.
setRootPassword: false

# No autologin on installed systems: every boot goes through the
# shedos-greeter. (The LIVE ISO's autologin is separate — agetty on
# tty1 in archiso — and unaffected by this setting.)
autologinGroup: autologin
doAutologin: false

# Shell
# ShedOS uses zsh as default shell
userShell: /usr/bin/bash

# Password requirements
passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=4

# Hostname validation
allowWeakPasswords: false
allowWeakPasswordsDefault: false

# User account settings
setHostname: true
writeHostsFile: true
