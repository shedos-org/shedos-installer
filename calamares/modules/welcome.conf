# ShedOS Welcome Module Configuration

showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

# System requirements
requirements:
    requiredStorage: 10.0      # GB minimum
    requiredRam: 1.0           # GB minimum
    check:
        - storage
        - ram
        - root
    required:
        - ram

# GeoIP for automatic timezone detection
geoip:
    style: "json"
    url: "https://ipapi.co/json"
    selector: "timezone"

# Language selection
languageIcon: languages
