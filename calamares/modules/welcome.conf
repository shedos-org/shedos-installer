# ShedOS Welcome Module Configuration

showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

# System requirements
requirements:
    requiredStorage: 20.0      # GB minimum
    requiredRam: 8.0           # GB minimum
    check:
        - storage
        - ram
        - root
    required:
        - ram

# GeoIP autodetection is intentionally not configured. The install is
# fully offline; a third-party probe would either fail (no network) or
# leak the user's IP for no benefit. Users pick their timezone manually.

# Language selection
languageIcon: languages
