# Optional apps picker for the Calamares show: sequence. User checks
# any subset (default: all 5); selection lands in globalstorage as
# packagechooser_apps (comma-separated package names). Read by
# shedos_optional_apps after pacstrap.

mode: multiple
method: legacy

items:
  - id: google-chrome
    package: google-chrome
    name: Google Chrome
    description: Google's web browser. Sign-in sync, Widevine for streaming services.

  - id: postman-bin
    package: postman-bin
    name: Postman
    description: API client for HTTP/REST development.

  - id: claude-code-bin
    package: claude-code-bin
    name: Claude Code
    description: Anthropic's agentic coding tool for the terminal.

  - id: jetbrains-toolbox
    package: jetbrains-toolbox
    name: JetBrains Toolbox
    description: Manage JetBrains IDEs (PyCharm, IntelliJ, WebStorm, etc.).

default:
  - google-chrome
  - postman-bin
  - claude-code-bin
  - jetbrains-toolbox
